name: NSE EOD Swing Scanner

on:
  workflow_dispatch:
  schedule:
    # 16:00 IST, Monday-Friday (GitHub cron uses UTC)
    - cron: "30 10 * * 1-5"

permissions:
  contents: read

concurrency:
  group: nse-eod-swing-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas requests

      - name: Run broker-free NSE EOD scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scanner.py

      - name: Upload scan results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nse-eod-swing-results
          path: nse_swing_signals.csv
          if-no-files-found: warn
          retention-days: 14
