
workflow = """name: NSE Swing Scanner

on:
  workflow_dispatch:

  schedule:
    # 10:15 UTC = 15:45 IST
    # Monday to Friday
    - cron: "15 10 * * 1-5"

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "requests>=2.31,<3" "beautifulsoup4>=4.12,<5" "pandas>=2.2,<3"

      - name: Run Scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python scanner.py
"""

path = Path("/mnt/data/nse-swing-scanner.yml")
path.write_text(workflow, encoding="utf-8")
print(f"Created: {path}")
print("Workflow updated: requirements.txt is no longer required.")
