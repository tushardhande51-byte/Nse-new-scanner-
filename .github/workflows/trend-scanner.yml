name: NSE Multi-Timeframe Trend Scanner

on:
  workflow_dispatch:
  schedule:
    # 10:05 IST, Monday-Friday (GitHub cron uses UTC); after the first three 15m candles close
    - cron: "35 4 * * 1-5"

permissions:
  contents: read

concurrency:
  group: nse-multi-timeframe-trend-scan
  cancel-in-progress: false

jobs:
  trend-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas requests

      - name: Run NSE multi-timeframe trend scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python trend_scanner.py

      - name: Upload trend results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nse-multi-timeframe-trends
          path: nse_timeframe_trends.csv
          if-no-files-found: warn
          retention-days: 14
