name: NSE Positional Scanner

on:
  # Manual-only: run from GitHub Actions when requested.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nse-positional-scan
  cancel-in-progress: false

jobs:
  positional-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas requests

      - name: Run NSE positional scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python positional_scanner.py

      - name: Upload positional scan results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nse-positional-signals
          path: nse_positional_signals.csv
          if-no-files-found: warn
          retention-days: 14
